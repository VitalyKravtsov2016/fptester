################################################
#
#  Все поля всех таблиц ФР
#
#  Обход таблиц командами 2Dh/2Eh, запись/чтение 1Eh/1Fh.
#  Для полей, которые печатаются на простом чеке продажи
#  (номер ККМ, клише, типы оплаты, налоги, отделы,
#  пользователь/оператор), дополнительно регистрируется чек
#  и OCR сверяет значение с таблицей.
#
#  Пропускаются таблицы паролей (2, 3) и сетевых настроек (16):
#  их поля покрыты поштучно в Tables2-7.yaml и Tables14-18.yaml.
#
################################################

name: "Все таблицы ФР"
description: "Обход всех полей таблиц: запись, чтение, чек"

tests:
  - name: "Все поля всех таблиц"
    testtype: all_table_fields
    skip_tables: [2, 3, 16]
    ecrmode_before: 2
    ecrmode_after: 2
